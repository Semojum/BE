services:
  backend:
    image: zxhwan/semojum-backend:latest
    ports:
      - "8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - redis
    volumes:
      - /home/joha-eun/server.crt:/home/joha-eun/server.crt:ro

  redis:
    image: redis:latest
    ports:
      - "6379:6379"