name: PR Test

# 머지 전에 테스트를 돌려 깨진 코드가 dev에 들어가는 것을 막는다.
# (기존에는 dev push 후에야 테스트가 돌아, 실패를 머지된 뒤에 알게 됐다)
# 저장소 설정의 branch protection에서 이 잡(test)을 required check로 걸면
# 빨간 PR은 머지 버튼 자체가 막힌다.
on:
  pull_request:
    branches:
      - dev
      - main

# 같은 PR에 커밋을 연달아 올리면 이전 커밋의 런은 의미가 없다 — 취소하고 최신 것만 돌린다
concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 의존성·빌드 캐시 — 캐시는 기본 브랜치(dev) 런이 쓰고 PR 런은 읽는다
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers(PostgreSQL·Redis)를 쓰므로 러너의 Docker가 필요하다(ubuntu-latest에 기본 포함)
      - name: Run tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-report
          path: build/reports/tests/test
          retention-days: 7
