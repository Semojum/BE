spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:34.47.68.184}:5432/postgres?ssl=true&sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      # V3 정책: 업로드 파일 1개당 100MB 상한
      max-file-size: 100MB
      # 파일 + mode 파라미터 + 멀티파트 오버헤드를 감안해 약간의 여유를 둔다
      max-request-size: 105MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000       # 1시간 (ms)
  refresh-token-expiry: 43200000     # 12시간 (ms) — V3 자동 로그인 X 정책으로 30일→12h 축소

# V3 운영자 API (X-Admin-Key 헤더 검증). 미설정 시 운영자 API 전부 차단
admin:
  api-key: ${ADMIN_API_KEY:}

job:
  stale:
    in-progress-timeout: 1h    # IN_PROGRESS 무진행 1시간 → FAILED
    pending-timeout: 12h       # PENDING 고아 12시간 → FAILED

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:semojum-bucket}

grpc:
  client:
    ai-server:
      # AI 서버는 같은 VPC(AWS 서울)에 있으므로 사설 IP로 접속한다.
      # 공인 IP로 가면 트래픽이 VPC를 벗어나 AI 보안그룹의 "BE 보안그룹 허용" 규칙에 걸리지 않아 차단된다.
      # (전송비 0원·지연 감소 효과도 있음) 주소는 환경변수로 교체 가능.
      address: ${GRPC_AI_ADDRESS:static://172.31.47.101:50051}
      negotiation-type: tls
      security:
        trust-cert-collection: ${GRPC_CERT_PATH}
        authority-override: semo-jum.com