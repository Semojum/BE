spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:34.47.68.184}:5432/postgres?ssl=true&sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # Flyway 스키마 마이그레이션 — 앱 기동 시 db/migration의 미적용 버전을 자동 적용
  # baseline: 이미 운영 중인 DB(V2 서비스 스키마 + v3_auth 적용 상태)를 버전 1로 간주하고,
  #           V2__ 이후 마이그레이션부터 적용한다. 첫 기동 때 flyway_schema_history가 자동 생성됨.
  # ⚠️ 신규 빈 DB에는 base 스키마(V1)가 없어 적용 불가 — 신규 환경 구축 시 운영 DB 덤프로 V1 작성 필요
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"

  jackson:
    # 응답 JSON의 시각도 한국 표준시로 직렬화
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          # DB 세션 시간대를 고정 — JVM 기본값에 끌려다니지 않게 한다
          time_zone: Asia/Seoul
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      # V3 정책: 업로드 파일 1개당 100MB 상한
      max-file-size: 100MB
      # 파일 + mode 파라미터 + 멀티파트 오버헤드를 감안해 약간의 여유를 둔다
      max-request-size: 105MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000       # 1시간 (ms)
  refresh-token-expiry: 43200000     # 12시간 (ms) — V3 자동 로그인 X 정책으로 30일→12h 축소

# V3 운영자 API (X-Admin-Key 헤더 검증). 미설정 시 운영자 API 전부 차단
admin:
  api-key: ${ADMIN_API_KEY:}

job:
  stale:
    in-progress-timeout: 1h    # IN_PROGRESS 무진행 1시간 → FAILED
    pending-timeout: 12h       # PENDING 고아 12시간 → FAILED

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:semojum-bucket}

grpc:
  client:
    ai-server:
      # AI 서버는 같은 VPC(AWS 서울)에 있으므로 사설 IP로 접속한다.
      # 공인 IP로 가면 트래픽이 VPC를 벗어나 AI 보안그룹의 "BE 보안그룹 허용" 규칙에 걸리지 않아 차단된다.
      # (전송비 0원·지연 감소 효과도 있음) 주소는 환경변수로 교체 가능.
      address: ${GRPC_AI_ADDRESS:static://172.31.47.101:50051}
      negotiation-type: tls
      security:
        trust-cert-collection: ${GRPC_CERT_PATH}
        authority-override: semo-jum.com