# 블루그린 전환 시 구 컨테이너가 처리 중이던 요청을 마저 끝내고 내려가도록 (신규 요청은 즉시 거절)
# SSE 장기 연결은 20초 뒤 끊김 — FE EventSource 자동 재연결 + 완료분 재전송으로 이어받음
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: backend
  datasource:
    # DB_HOST는 기본값을 두지 않는다 — 예전 기본값(구 GCP Cloud SQL 주소)이 남아 있어
    # 환경변수를 빠뜨리면 이미 없는 호스트로 조용히 붙으러 갔다. 미설정 시 기동에서 바로 실패한다.
    url: jdbc:postgresql://${DB_HOST}:5432/postgres?ssl=true&sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # Flyway 스키마 마이그레이션 — 앱 기동 시 db/migration의 미적용 버전을 자동 적용
  # baseline: 이미 운영 중인 DB(V2 서비스 스키마 + v3_auth 적용 상태)를 버전 1로 간주하고,
  #           V2__ 이후 마이그레이션부터 적용한다. 첫 기동 때 flyway_schema_history가 자동 생성됨.
  # ⚠️ 신규 빈 DB에는 base 스키마(V1)가 없어 적용 불가 — 신규 환경 구축 시 운영 DB 덤프로 V1 작성 필요
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"

  jackson:
    # 응답 JSON의 시각도 한국 표준시로 직렬화
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          # DB 세션 시간대를 고정 — JVM 기본값에 끌려다니지 않게 한다
          time_zone: Asia/Seoul
    # 운영 SQL 로그 금지 — show-sql은 로거가 아닌 stdout 직행이라 타임스탬프·레벨 없이 찍혀
    # 로그의 60%를 차지했다(2026-08-10 실측). 필요 시 org.hibernate.SQL=DEBUG로 로거 경유 활성화
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      # V3 정책: 업로드 파일 1개당 100MB 상한
      max-file-size: 100MB
      # 파일 + mode 파라미터 + 멀티파트 오버헤드를 감안해 약간의 여유를 둔다
      max-request-size: 105MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000       # 1시간 (ms)
  refresh-token-expiry: 43200000     # 12시간 (ms) — V3 자동 로그인 X 정책으로 30일→12h 축소

job:
  stale:
    in-progress-timeout: 1h    # IN_PROGRESS 무진행 1시간 → FAILED
    pending-timeout: 12h       # PENDING 고아 12시간 → FAILED

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:semojum-bucket}

grpc:
  ai:
    # AI 서버 목록: host:port:슬롯수 (쉼표 구분, 예: ip1:50051:2,ip2:50051:2)
    # 슬롯수 = 서버당 동시 요청 상한(AI 내부 파이프라인 단계 수). 워커 수 = 총 슬롯 수로 자동 계산.
    # AI 서버는 같은 VPC(AWS 서울)에 있으므로 사설 IP로 접속한다.
    # 공인 IP로 가면 트래픽이 VPC를 벗어나 AI 보안그룹의 "BE 보안그룹 허용" 규칙에 걸리지 않아 차단된다.
    # (전송비 0원·지연 감소 효과도 있음) 서버 증설·슬롯 조정은 환경변수 수정 + 재시작으로 끝.
    servers: ${GRPC_AI_SERVERS:172.31.47.101:50051:4}
    cert-path: ${GRPC_CERT_PATH}
    authority: semo-jum.com
    # 응답 없는 요청이 슬롯을 영구 점유하지 못하게 하는 백스톱. "BE가 요청을 보낸 시점"부터 카운트.
    # AI 하드 타임아웃 180s는 "변환 시작" 기준(AI팀 확인) — 앞 요청을 기다린 뒤 변환하는
    # 최악 케이스가 대기(~180s) + 자기 변환(180s) ≈ 360s이므로 400s로 감싼다.
    # 슬롯을 늘려 대기가 길어지면 DEADLINE_EXCEEDED가 늘 수 있으니 로그를 보고 이 값도 함께 조정.
    deadline-seconds: ${GRPC_AI_DEADLINE_SECONDS:400}
# CORS origin 패턴 — 기본 전면 허용(쿠키 미사용 Bearer 구조라 제한 실익 없음).
# ⚠️ 좁히면 데스크톱 앱(Origin: null)이 깨진다 — 좁힐 땐 앱 origin 포함 필수 (2026-08-20 회귀 실측)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# 운영자 콘솔(웹사이트) Origin 목록 (V28 — MAC 방식 폐기 후 대체, 2026-08-21).
# 콘솔에서 온 로그인(Origin 일치)은 웹 관리자(admin_scope=WEB) 전용, 웹 관리자는 콘솔에서만 로그인 가능.
# 콘솔 주소가 바뀌면 EC2 .env의 ADMIN_CONSOLE_ORIGINS로 교체(콤마 구분, 스킴 포함)
admin:
  console-origins: ${ADMIN_CONSOLE_ORIGINS:http://54.116.113.4,https://admin.semo-jum.com}

# HWP → PDF 변환 (mode a HWP 지원, 2026-08-24) — 도구는 Dockerfile에 내장(pyhwp+LibreOffice+한글 폰트).
# 로컬 개발 등 경로가 다른 환경은 env로 교체
hwp2pdf:
  python: ${HWP2PDF_PYTHON:python3}
  script: ${HWP2PDF_SCRIPT:/app/hwp2odt.py}
  soffice: ${HWP2PDF_SOFFICE:soffice}
  # 단계별(pyhwp·soffice) 실행 상한 — 동시 변환 경합(vCPU 2)까지 감안한 여유값 (2026-08-24 120→300)
  timeout-seconds: ${HWP2PDF_TIMEOUT_SECONDS:300}

# 문의 메일함 연동 (T1-9) — Google Workspace IMAP 읽기 전용 폴링.
# 자격증명 미설정이면 폴러 비활성(fail-safe). PASSWORD는 Workspace "앱 비밀번호"(2단계 인증 필요)
mail:
  inbox:
    host: imap.gmail.com
    username: ${MAIL_INBOX_USERNAME:}
    password: ${MAIL_INBOX_PASSWORD:}
    poll-delay-ms: 300000   # 5분

# 로그 형식: 시각 레벨 [추적키] 로거 : 메시지
# 추적키(ctx) = 요청 스레드는 req-xxxxxxxx(RequestLogFilter), 워커 스레드는 jobId|pN(PageWorker)
# 같은 요청·같은 작업의 로그를 grep 하나로 묶기 위한 것. 없으면 "-"
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%X{ctx:--}] %-36.36logger{36} : %m%n%wEx"
