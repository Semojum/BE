spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:34.47.68.184}:5432/postgres?ssl=true&sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000       # 1시간 (ms)
  refresh-token-expiry: 43200000     # 12시간 (ms) — V3 자동 로그인 X 정책으로 30일→12h 축소

# V3 운영자 API (X-Admin-Key 헤더 검증). 미설정 시 운영자 API 전부 차단
admin:
  api-key: ${ADMIN_API_KEY:}

job:
  stale:
    in-progress-timeout: 1h    # IN_PROGRESS 무진행 1시간 → FAILED
    pending-timeout: 12h       # PENDING 고아 12시간 → FAILED

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:semojum-bucket}

grpc:
  client:
    ai-server:
      address: static://136.119.89.254:50051
      negotiation-type: tls
      security:
        trust-cert-collection: ${GRPC_CERT_PATH}
        authority-override: semo-jum.com