spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://34.47.68.184:5432/postgres?ssl=true&sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000       # 1시간 (ms)
  refresh-token-expiry: 2592000000   # 30일 (ms)

gcs:
  bucket-name: semojum-bucket

grpc:
  client:
    ai-server:
      address: static://136.119.89.254:50051
      negotiation-type: tls
      security:
        trust-cert-collection: ${GRPC_CERT_PATH}
        authority-override: semo-jum.com